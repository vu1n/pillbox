name = "pillbox-do-spike"
main = "src/worker.ts"
compatibility_date = "2026-06-01"
# The Agents SDK imports node built-ins (diagnostics_channel, os, path via its
# deps) — nodejs_compat is required or the bundle fails to resolve them.
compatibility_flags = ["nodejs_compat"]

# One Durable Object class = the per-session §0 gateway. Binding name matches the
# class so routeAgentRequest resolves /agents/session-gateway/<sessionId>/*.
[[durable_objects.bindings]]
name = "SessionGateway"
class_name = "SessionGateway"

# SQLite-backed storage migration (GA). `new_sqlite_classes` is required
# for ctx.storage.sql to be available on the class.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionGateway"]

[observability]
enabled = true
