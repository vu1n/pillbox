[package]
name = "pillbox"
version = "0.1.0"
edition = "2021"
authors = ["vu1n"]
license = "MIT OR Apache-2.0"
description = "Sandboxed coding agents, bundled — local Docker, SSH VPS, or E2B managed sandbox. Per-project workspace + vault + auth + config in one self-contained pillbox."
repository = "https://github.com/vu1n/pillbox"
homepage = "https://github.com/vu1n/pillbox"
keywords = ["sandbox", "agent", "claude", "codex", "e2b"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Credential vault — MITM HTTPS proxy that swaps stub creds for real
# ones at the host boundary. Anthropic + codex providers as of v0.5.
# See src/vault/.
hudsucker = { version = "0.24", default-features = true, features = ["http2"] }
async-trait = "0.1"
rcgen = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
http-body-util = "0.1"
time = "0.3"
uuid = { version = "1", features = ["v7"] }
tempfile = "3"

# Workspace versioning — rustic_core is a Rust port of restic. Each
# pillbox owns one rustic repository (local on disk, or S3-shaped via
# opendal). See src/workspace/.
rustic_core = "0.11"
rustic_backend = { version = "0.6", default-features = false, features = ["opendal"] }
rand = "0.9"
# Base64 for the exec channel's ExecOutput.data (matches the proto `bytes`
# field's protobuf-JSON encoding so binary stdout survives the wire).
base64 = "0.22"
# Unix-only: `pillbox session detach <id>` SIGTERMs the attached
# pillbox process. Direct dep so a `cargo audit` flags advisories
# instead of hiding behind a transitive resolution.
libc = "0.2"
# Webhook sink for the events stream (`pillbox session done` POSTs to
# `$PILLBOX_EVENTS_WEBHOOK`). The `blocking` feature lets us call from
# sync code paths without dragging a tokio runtime through every
# event-emit. Already in the tree transitively via hudsucker; direct
# dep so a `cargo audit` flags advisories.
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
# OTel sinks — per-event OTLP log records + per-session OTLP spans
# to whichever collector `OTEL_EXPORTER_OTLP_ENDPOINT` points at.
# Default transport is HTTP/protobuf via the blocking reqwest client
# (no tokio runtime drag — emit is sync, matching the webhook sink's
# model). Spans are sandbox-only and only emitted at terminal events
# when the wrapper has exported `PILLBOX_SESSION_STARTED_AT` so
# span.start_time is meaningful.
opentelemetry = "0.30"
opentelemetry_sdk = { version = "0.30", default-features = false, features = ["logs", "trace"] }
opentelemetry-otlp = { version = "0.30", default-features = false, features = ["logs", "trace", "http-proto", "reqwest-blocking-client"] }
# rustic_core re-exposes timestamps as jiff::Zoned — depend on jiff
# directly so the helper that normalizes to strict RFC3339 doesn't
# look at types it can't name.
jiff = "0.2"
# Interactive attach transport — the in-sandbox pty-host keeps a vt100
# screen model so reattach can serve a bounded ANSI snapshot of current
# state. state_formatted()+contents_formatted() round-trips modes the
# way orca's xterm-headless + SerializeAddon does, minus the hand-rolled
# mouse-mode mirroring. See docs/attach-transport.md.
vt100 = "0.15"
# portable-pty: the in-sandbox pty-host owns the agent's PTY through this
# (spawn under a PTY, read/write, resize). Runs sandbox-side.
portable-pty = "0.8"
# crossterm: host-side only — the terminal front-end pump (`pty-attach`)
# uses it for raw mode + terminal size. Never runs in the sandbox.
crossterm = "0.27"

[features]
# Opt-in OTLP/gRPC transport for the OTel logs sink. Adds tonic +
# prost to the binary; the sandbox runtime image build leaves it off
# to keep the in-sandbox pillbox lean (HTTP/protobuf is the default
# everywhere). Host-side users who run a gRPC-only collector enable
# this with `cargo install pillbox --features otel-grpc`.
otel-grpc = ["opentelemetry-otlp/grpc-tonic"]

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
