name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Cancel stale in-flight runs when a new commit lands on the same PR /
# branch — saves macOS minutes (~10x cost) on iterative force-pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cloudflare:
    name: Cloudflare gateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-spike
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-spike/package-lock.json
      - run: npm ci
      - run: npm test
      # Runner image packaging contract (runner/install-codex-package.sh).
      - run: node --test ../runner/codex-package.test.mjs
      - run: npx tsc --noEmit
      # src/contract.ts must equal what json2ts generates from contract.schema.json.
      - run: npm run check:contract
      # Real workerd + SQLite-backed DO, no account or paid container required.
      - run: ../scripts/smoke/cf.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      # rust-cache keys on rustc + Cargo.lock, prunes the registry to used crates,
      # and cleans target/ of intermediate junk — so the cache stays small and
      # survives eviction against the matrix + the runner-image buildx cache. The
      # old hand-rolled actions/cache of the whole target/ bloated toward the 10GB
      # repo limit and evicted, forcing cold rebuilds (the ~20min CI).
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # `--no-default-features` = the in-guest tools build: no substrate (no
      # libkrun), so it needs no libkrun toolchain and links everywhere. The
      # libkrun build itself links and runs in the dedicated `libkrun` job.
      # Lint+format gates are platform-independent; only run them once
      # (on ubuntu) to save macOS minutes (~10x cost).
      - if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: Feature map pointers and helper
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 scripts/featuremap.py check
          python3 -m unittest discover -s scripts -p 'test_featuremap.py' -v
      - name: Repository smoke fixtures (offline)
        if: matrix.os == 'ubuntu-latest'
        run: |
          bash -n scripts/smoke/repository-execution.sh
          python3 -m unittest discover -s scripts/smoke/repository-execution -p 'test_*.py' -v
      - name: Claude text smoke fixtures (offline)
        if: matrix.os == 'ubuntu-latest'
        run: |
          bash -n scripts/smoke/claude-text.sh
          python3 scripts/smoke/test_claude_text_bridge.py
      # `--workspace` covers crates/ too: the session packet (`pillbox-packet`)
      # and the credential-name table it shares with the agent registry.
      - name: Test (in-guest build)
        run: cargo test --workspace --no-default-features --all-targets --locked
      # contract.schema.json must equal what schemars emits from src/contract.rs.
      - if: matrix.os == 'ubuntu-latest'
        run: cargo test --no-default-features --features contract-schema contract_schema_is_current --locked
      - name: Clippy (in-guest build)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --no-default-features --features contract-schema --all-targets --locked -- -D warnings
      # The full (default, libkrun) build only type-checks here — clippy never
      # links libkrun — so the code the in-guest build compiles but doesn't use
      # is linted on Linux too, not only on the macOS `libkrun` job.
      - name: Clippy (full build)
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Callers (Stratus) build the packet crate alone, without pillbox or its
      # toolchain; prove it still builds that way.
      - name: Session packet builds alone
        if: matrix.os == 'ubuntu-latest'
        run: cargo build -p pillbox-packet --locked

  # The real backend: compile, lint, and unit-test pillbox with `--features
  # libkrun`. Runs on macOS because the libkrun backend is macOS-only today (it
  # uses APFS `clonefile`, and the egress stack needs libkrun's brew build; the
  # from-source Linux build is missing `krun_add_net_unixstream`). brew supplies
  # libkrun + libkrunfw from the `libkrun/krun` tap and build.rs finds them at
  # /opt/homebrew/lib. No VM boots here — GitHub macOS runners can't nest HVF —
  # so this is build + link + non-VM unit tests; the VM-boot smoke stays a local
  # gate (scripts/smoke/libkrun.sh). The Linux path (cheap-KVM, CI VM-boot) is a
  # deferred task, and the intended Linux backend is QEMU, not libkrun-on-Linux.
  libkrun:
    # The `macos-15` runner label resolves to arm64 Sequoia, matching the
    # libkrun toolchain's supported CI architecture.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install rust
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: libkrun   # distinct from the in-guest-build `test` job's artifacts
      - name: Install libkrun
        # Homebrew now gates third-party taps behind HOMEBREW_REQUIRE_TAP_TRUST
        # (set on the runner image) — `brew install` refuses an untapped-trust
        # formula ("Refusing to load formula … from untrusted tap"). `brew trust`
        # the tap between tap+install; non-interactive + forward-compatible for
        # when tap-trust becomes the Homebrew default.
        run: |
          brew tap libkrun/krun
          brew trust libkrun/krun
          # The tap currently infers libkrunfw's version as `64` from its
          # `aarch64` source URL, so its generated bottle URL does not match the
          # published 5.5.0 asset. Build that one formula from its verified
          # prebuilt source tarball, then install libkrun's normal bottle.
          brew install --build-from-source libkrunfw
          brew install libkrun
      - name: Clippy (libkrun)
        run: cargo clippy --all-targets --features libkrun -- -D warnings
      - name: Test (libkrun)
        run: cargo test --all-targets --features libkrun
