# Compatibility deployment for sessions created by the original spike. It is
# intentionally separate from the supported pillbox-managed deployment: it
# keeps the old Worker name and v1 SessionGateway namespace for rollback and
# historical evidence. New managed sessions use wrangler.toml.
name = "pillbox-do-spike"
main = "src/worker.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
# A rollback must not turn off workload authorization on the existing namespace.
MANAGED_AUTH_REQUIRED = "1"

[[durable_objects.bindings]]
name = "SessionGateway"
class_name = "SessionGateway"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionGateway", "Sandbox"]

[observability]
enabled = true
