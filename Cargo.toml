[package]
name = "pillbox"
version = "0.1.0-alpha.1"
edition = "2021"
authors = ["vu1n"]
license = "MIT OR Apache-2.0"
description = "Sandboxed coding agents with one-command auth (gh-auth-style for Claude Code / Codex / opencode)"
repository = "https://github.com/vu1n/pillbox"
homepage = "https://github.com/vu1n/pillbox"
keywords = ["sandbox", "agent", "claude", "codex", "docker"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"

# Platform-native credential stores. v3 has cleaner platform features than
# v4 (which pulls in a SQLite-style fallback store we don't need).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
