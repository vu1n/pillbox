# Keep the deployed Worker name stable while the package graduates from spike
# status. Historical namespace retirement is a separate release operation.
name = "pillbox-do-spike"
main = "src/worker.ts"
compatibility_date = "2026-06-01"
# Sandbox SDK dependencies use Node compatibility shims.
compatibility_flags = ["nodejs_compat"]
# Contract-only deploy: D1/R2 execution lifecycle without a container binding.
# The full execution path lives in wrangler.container.toml (deploy with `-c`).
workers_dev = true

[[d1_databases]]
binding = "EXECUTION_DB"
database_name = "pillbox-execution-preview"
database_id = "2bdaab2a-d0df-48cd-8fb5-fd4feeab091b"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "EXECUTION_EVIDENCE"
bucket_name = "pillbox-execution-evidence-preview"

[[analytics_engine_datasets]]
binding = "RUN_COSTS"
dataset = "pillbox_execution_run_costs_preview"

# Private Huddles authorization transport. The binding authenticates transport
# only; every ensure/invoke call still carries a signed execution grant.
[[services]]
binding = "PillboxAuthorizationControlPlane"
service = "huddles-projectors"
entrypoint = "PillboxAuthorizationControlPlaneEntrypoint"

# Sandbox is registered in the migration (worker.ts exports the class) but NOT
# bound and NOT given a container here — so nothing is instantiated and the free
# tier provisions no container. The container config adds the binding + [[containers]].
[[migrations]]
tag = "v1"
# Historical migration record. SessionGateway is deliberately not bound or
# exported; deleting its existing namespace/data is a separate retention review.
new_sqlite_classes = ["SessionGateway", "Sandbox"]

[observability]
enabled = true
