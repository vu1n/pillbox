name: runner-image
on:
  pull_request:
    paths:
      - runner/Dockerfile
      - .github/workflows/runner-image.yml
  push:
    branches: [main]
    paths:
      - runner/Dockerfile
      - .github/workflows/runner-image.yml
    tags: ['v*']

permissions:
  contents: read
  packages: write

# Cancel stale in-flight runs when a new commit lands on the same PR /
# branch — image builds are slow and we'd rather burn the latest.
concurrency:
  group: runner-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Authenticate to GHCR only on push events; PRs from forks don't
      # have permission to push and would fail the login step.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag scheme:
      #   PR             → ghcr.io/vu1n/pillbox-runner:pr-NN  (build-only, never pushed)
      #   push to main   → ghcr.io/vu1n/pillbox-runner:rolling
      #   tag vX.Y.Z     → ghcr.io/vu1n/pillbox-runner:vX.Y.Z + :latest
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pillbox-runner
          tags: |
            type=ref,event=pr,prefix=pr-
            type=raw,value=rolling,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: runner
          file: runner/Dockerfile
          platforms: linux/amd64,linux/arm64
          # PRs build to verify the Dockerfile + Renovate bumps still
          # produce a valid image, but don't push (no GHCR creds).
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
