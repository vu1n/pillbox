name: runner-image
# Tag pushes publish immutable vX.Y.Z + the latest alias; pushes to main
# (refresh-PR merges, harness/Dockerfile changes, in-sandbox pillbox src
# changes) rebuild and republish the moving dev tag; PRs that touch runner
# packaging build both architectures WITHOUT publishing, so a refresh PR is
# image-tested before anyone merges it.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: ['runner/**', 'scripts/build-runner.sh']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: runner-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Fork PRs get a read-only token — they cannot push digests to ghcr, so
    # they skip image CI entirely (same-repo PRs run it).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: runner/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/pillbox-runner,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=runner-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runner-${{ matrix.arch }}
      # A failed probe leaves an untagged digest, never a release/latest alias.
      - name: Verify bundled harnesses
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/pillbox-runner@${{ steps.build.outputs.digest }}
        run: |
          codex_version=$(sed -n 's/^ARG CODEX_VERSION=//p' runner/Dockerfile)
          bash scripts/verify-runner.sh "$IMAGE" "$codex_version"
      - name: Export verified digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    # PRs build-only: nothing is ever tagged from a pull request.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pillbox-runner
          tags: |
            type=raw,value=dev,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
          flavor: |
            latest=auto
      - name: Publish verified multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/pillbox-runner
          METADATA: ${{ steps.meta.outputs.json }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$METADATA")
          test "${#tags[@]}" -gt 0
          args=()
          for tag in "${tags[@]}"; do args+=(--tag "$tag"); done
          sources=()
          for digest in *; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || exit 1
            sources+=("$IMAGE@sha256:$digest")
          done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${tags[0]}"
