[package]
name = "pillbox"
version = "0.1.0-alpha.1"
edition = "2021"
authors = ["vu1n"]
license = "MIT OR Apache-2.0"
description = "Sandboxed coding agents with one-command auth (gh-auth-style for Claude Code / Codex / opencode)"
repository = "https://github.com/vu1n/pillbox"
homepage = "https://github.com/vu1n/pillbox"
keywords = ["sandbox", "agent", "claude", "codex", "docker"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Credential vault — MITM HTTPS proxy that swaps stub creds for real
# ones at the host boundary. Anthropic only for v0.4. See src/vault/.
hudsucker = { version = "0.24", default-features = true, features = ["http2"] }
rcgen = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
http-body-util = "0.1"
time = "0.3"
uuid = { version = "1", features = ["v7"] }
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
