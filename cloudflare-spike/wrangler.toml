# Keep the deployed Worker name and SessionGateway namespace stable while the
# package graduates from spike status. A namespace transfer is a separate
# coordinated Cloudflare migration, never a config rename.
name = "pillbox-do-spike"
main = "src/worker.ts"
compatibility_date = "2026-06-01"
# The Agents SDK imports node built-ins; nodejs_compat is required.
compatibility_flags = ["nodejs_compat"]
# Free-tier deploy: the §0 gateway only — no container. SQLite-backed DOs run on
# the Workers free plan (proven: this worker + the SessionGateway DO uploaded
# fine on a free account; only the container step needs Workers Paid). The full
# container path lives in wrangler.container.toml (deploy with `-c`). `/input`
# degrades to append-only when there's no Sandbox binding (see session_gateway).
workers_dev = true

# The per-session §0 gateway. routeAgentRequest resolves
# /agents/session-gateway/<sessionId>/*.
[[durable_objects.bindings]]
name = "SessionGateway"
class_name = "SessionGateway"

[[durable_objects.bindings]]
name = "CredentialBroker"
class_name = "CredentialBroker"

# Private Huddles authorization transport. The binding authenticates transport
# only; every ensure/invoke call still carries a signed execution grant.
[[services]]
binding = "PillboxAuthorizationControlPlane"
service = "huddles-projectors"
entrypoint = "PillboxAuthorizationControlPlaneEntrypoint"

# Sandbox is registered in the migration (worker.ts exports the class) but NOT
# bound and NOT given a container here — so nothing is instantiated and the free
# tier provisions no container. The container config adds the binding + [[containers]].
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionGateway", "Sandbox"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CredentialBroker"]

[observability]
enabled = true
